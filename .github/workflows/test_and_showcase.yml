name: Test and Showcase Results

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "No requirements.txt found."; fi

    - name: Run tests
      run: |
        if [ -d tests ]; then python -m unittest discover tests; else echo "No tests directory found."; fi

  showcase:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Output test results
      run: echo "All tests passed successfully! Ready to showcase results."